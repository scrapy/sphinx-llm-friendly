[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sphinx-llm-friendly"
version = "0.0.0"
description = "Sphinx extension to make documentation LLM-friendly"
dependencies = [
    "docutils",
    "sphinx>=7.4",
    "tabulate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Documentation :: Sphinx",
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10"
authors = [{ name = "Scrapy developers", email = "opensource@zyte.com" }]
maintainers = [{ name = "Scrapy developers", email = "opensource@zyte.com" }]

[project.scripts]
sphinx-llm-friendly = "sphinx_llm_friendly._build:main"

[project.entry-points."sphinx.builders"]
llm_markdown = "sphinx_llm_friendly"
llm_singlemarkdown = "sphinx_llm_friendly"

[project.urls]
Source = "https://github.com/scrapy/sphinx-llm-friendly"
Tracker = "https://github.com/scrapy/sphinx-llm-friendly/issues"
"Release notes" = "https://github.com/scrapy/sphinx-llm-friendly/blob/main/CHANGES.rst"

[tool.hatch.build.targets.sdist]
include = ["/sphinx_llm_friendly", "/tests"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bumpversion]
current_version = "0.0.0"
commit = true
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGES.rst"
search = "\\(unreleased\\)$"
replace = "({now:%Y-%m-%d})"
regex = true

[tool.ruff.lint]
extend-select = [
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # pydocstyle
    "D",
    # flake8-future-annotations
    "FA",
    # flynt
    "FLY",
    # refurb
    "FURB",
    # isort
    "I",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-logging
    "LOG",
    # Perflint
    "PERF",
    # pygrep-hooks
    "PGH",
    # flake8-pie
    "PIE",
    # pylint
    "PL",
    # flake8-pytest-style
    "PT",
    # flake8-use-pathlib
    "PTH",
    # flake8-pyi
    "PYI",
    # flake8-quotes
    "Q",
    # flake8-return
    "RET",
    # flake8-raise
    "RSE",
    # Ruff-specific rules
    "RUF",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # flake8-slots
    "SLOT",
    # flake8-debugger
    "T10",
    # flake8-type-checking
    "TC",
    # flake8-tidy-imports
    "TID",
    # pyupgrade
    "UP",
    # pycodestyle warnings
    "W",
    # flake8-2020
    "YTT",
]
ignore = [
    # No public API to document
    "D",
]

[tool.ruff.lint.per-file-ignores]
"sphinx_llm_friendly/_contexts.py" = ["B008", "PT018", "S101"]
"sphinx_llm_friendly/_translator.py" = ["PLR0911", "S101"]
"tests/*" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
